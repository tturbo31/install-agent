name: Daily Intelligence Agent (Camo)

# Roda o agente de scraping/análise todos os dias e atualiza o dashboard + envia email.
#
# IMPORTANTE: workflows do GitHub Actions SÓ funcionam quando este arquivo está na
# RAIZ do repositório, em .github/workflows/ (nunca dentro de uma subpasta do projeto).
# Por isso o agendamento anterior nunca rodava — ele estava em
# agente-de-conteudo-atualisado-claude/.github/workflows/ e era ignorado.

on:
  schedule:
    # 11:00 UTC = 08:00 no horário de Brasília (BRT). Ajuste se quiser outro horário.
    - cron: "0 11 * * *"
  workflow_dispatch: {} # Permite disparar manualmente pela aba Actions do GitHub

# Todos os comandos `run` executam dentro da subpasta do projeto.
defaults:
  run:
    working-directory: agente-de-conteudo-atualisado-claude

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agente-de-conteudo-atualisado-claude/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run daily intelligence agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          # Use um Personal Access Token salvo como secret GH_PAT
          # (o GITHUB_TOKEN automático não consegue ler outros repositórios públicos com o mesmo limite).
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MEMORY_STORE_ID: ${{ secrets.MEMORY_STORE_ID }}
          # Opcional — desbloqueia Google + LinkedIn (Reddit funciona sem isto).
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npm start
